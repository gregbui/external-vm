apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: externalvms.myorg.io
spec:
  group: myorg.io
  names:
    kind: ExternalVM
    plural: externalvms
  connectionSecretKeys:
    - kubeconfig
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                vmName:
                  type: string
                  maxLength: 63
                networkName:
                  type: string
                  maxLength: 63
                externalIPPool:
                  type: string
                cpu:
                  type: integer
                  default: 2
                memory:
                  type: string
                  default: "4Gi"
                diskSize:
                  type: string
                  default: "20Gi"
                image:
                  type: string
                  default: "quay.io/example/rhel9:latest"
                bridgeName:
                  type: string
                  default: "br-ex"
                subnet:
                  type: string
                  default: "10.20.30.0/24"
                gateway:
                  type: string
                  default: "10.20.30.1"
                ipRangeStart:
                  type: string
                  default: "10.20.30.100"
                ipRangeEnd:
                  type: string
                  default: "10.20.30.200"
                namespace:
                  type: string
                  default: "default"
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                externalIP:
                  type: string
                nadName:
                  type: string
                vmUID:
                  type: string
