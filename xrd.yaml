apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: externalvms.myorg.io
spec:
  group: myorg.io
  names:
    kind: ExternalVM
    plural: externalvms
  connectionSecretKeys:
    - kubeconfig
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                vmName:
                  type: string
                  maxLength: 63
                networkName:
                  type: string
                  maxLength: 63
                externalIPPool:
                  type: string
                cpu:
                  type: integer
                  default: 2
                memory:
                  type: string
                  default: "4Gi"
                diskSize:
                  type: string
                  default: "20Gi"
                image:
                  type: string
                  default: "quay.io/example/rhel9:latest"
                bridgeName:
                  type: string
                  default: "br-ex"
                subnet:
                  type: string
                  default: "10.20.30.0/24"
                gateway:
                  type: string
                  default: "10.20.30.1"
                ipRangeStart:
                  type: string
                  default: "10.20.30.100"
                ipRangeEnd:
                  type: string
                  default: "10.20.30.200"
                namespace:
                  type: string
                  default: "default"
                # ── OS Type ──
                # linux or windows. Affects disk bus type and network config injection.
                osType:
                  type: string
                  default: "linux"
                  enum:
                    - linux
                    - windows
                # ── Data Disks ──
                # Additional PVC-backed disks appended to the VM on top of the
                # base OS disk (rootdisk). Variable length — specify 1 to N.
                # The data-disk-fn Function creates PVCs and patches the VM.
                dataDisks:
                  type: array
                  items:
                    type: object
                    required:
                      - name
                      - size
                    properties:
                      name:
                        type: string
                        description: Disk name (used as PVC suffix and disk identifier).
                        maxLength: 63
                      size:
                        type: string
                        description: Disk size (e.g. "50Gi", "100Gi").
                        pattern: '^\d+(\.\d+)?(Ki|Mi|Gi|Ti)?$'
                      storageClassName:
                        type: string
                        description: StorageClass for the PVC. Cluster default if omitted.
                        maxLength: 253
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                externalIP:
                  type: string
                nadName:
                  type: string
                vmUID:
                  type: string
                # ── OS Type Status
                osType:
                  type: string
                  description: The OS type of the VM (linux or windows).
                # ── Data Disk Status ──
                # PVC names for each provisioned data disk, in order.
                dataDisks:
                  type: array
                  description: Names of provisioned data disk PVCs.
                  items:
                    type: string
