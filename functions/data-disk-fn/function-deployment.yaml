---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: data-disk-fn
  namespace: crossplane-functions
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: data-disk-fn
rules:
  # Function needs to manage PVCs for data disks
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: data-disk-fn
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: data-disk-fn
subjects:
  - kind: ServiceAccount
    name: data-disk-fn
    namespace: crossplane-functions
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crossplane-function-data-disk-fn
  namespace: crossplane-functions
  labels:
    app: data-disk-fn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-disk-fn
  template:
    metadata:
      labels:
        app: data-disk-fn
    spec:
      serviceAccountName: data-disk-fn
      containers:
        - name: function
          image: example.com/my-org/external-vm-fn/data-disk-fn:latest
          args: ["--insecure"]
          ports:
            - containerPort: 9443
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
