---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ip-inject-fn
  namespace: crossplane-functions
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ip-inject-fn
rules:
  # Function needs to read the Infoblox credentials secret
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
  # Function needs to update XR status with allocated IP
  - apiGroups:
      - myorg.io
    resources:
      - externalvms
    verbs:
      - get
      - list
      - watch
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ip-inject-fn
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ip-inject-fn
subjects:
  - kind: ServiceAccount
    name: ip-inject-fn
    namespace: crossplane-functions
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crossplane-function-ip-inject-fn
  namespace: crossplane-functions
  labels:
    app: ip-inject-fn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ip-inject-fn
  template:
    metadata:
      labels:
        app: ip-inject-fn
    spec:
      serviceAccountName: ip-inject-fn
      containers:
        - name: function
          image: example.com/my-org/external-vm-fn/ip-inject-fn:latest
          args: ["--insecure"]
          ports:
            - containerPort: 9443
          env:
            # Infoblox WAPI endpoint (required)
            - name: INFOBLOX_HOST
              valueFrom:
                secretKeyRef:
                  name: infoblox-credentials
                  key: host
            # Infoblox credentials (optional — secret also has username/password)
            - name: INFOBLOX_USER
              valueFrom:
                secretKeyRef:
                  name: infoblox-credentials
                  key: username
            - name: INFOBLOX_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: infoblox-credentials
                  key: password
            # Infoblox CA cert path (optional — for self-signed certs)
            - name: INFOBLOX_CA_CERT_PATH
              value: /certs/infoblox-ca.crt
          volumeMounts:
            - name: infoblox-ca
              mountPath: /certs
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: infoblox-ca
          configMap:
            name: infoblox-wapi-ca-cert
