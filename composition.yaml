apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: external-vm-composition
  labels:
    type: external-network
    provider: kubevirt
spec:
  mode: Pipeline
  compositeTypeRef:
    apiVersion: myorg.io/v1alpha1
    kind: ExternalVM
  compositeResourceSelector:
    matchLabels:
      myorg.io/external-vm: "true"
  writeConnectionSecretsToNamespace: crossplane-system
  composedResources:

    # ── NAD ──
    - name: network-attachment-definition
      base:
        apiVersion: k8s.cni.cncf.io/v1
        kind: NetworkAttachmentDefinition
        metadata:
          labels:
            crossplane.io/composition: external-vm-composition
        spec:
          config: '{"cniVersion":"0.3.1","type":"bridge","bridge":"br-ex","ipam":{"type":"host-local","subnet":"10.20.30.0/24","gateway":"10.20.30.1","routes":[{"dst":"0.0.0.0/0","gw":"10.20.30.1"}]}}'

    # ── VirtualMachine ──
    - name: virtual-machine
      base:
        apiVersion: kubevirt.io/v1
        kind: VirtualMachine
        metadata:
          labels:
            crossplane.io/composition: external-vm-composition
            kubevirt.io/domain: example-vm
        spec:
          runStrategy: RerunOnFailure
          template:
            metadata:
              labels:
                kubevirt.io/domain: example-vm
            spec:
              domain:
                devices:
                  disks:
                    - name: rootdisk
                      disk:
                        bus: virtio
                    - name: cloudinitdisk
                      disk:
                        bus: virtio
                  interfaces:
                    - name: external
                      bridge: {}
                      model: virtio
                networks:
                  - name: external
                    multus:
                      networkName: default/network-attachment-definition
                  - name: podnetwork
                    pod: {}
              volumes:
                - name: rootdisk
                  persistentVolumeClaim:
                    claimName: ""
                - name: cloudinitdisk
                  cloudInitNoCloud:
                    userData: |
                      #cloud-config
                      hostname: vm-external
              # data disk volumes appended here by data-disk-fn

  patches:

    # ── XR spec -> VM (metadata) ──
    - type: FromCompositeFieldPath
      description: Propagate vmName to VM metadata.name
      from: spec.vmName
      to: metadata.name
      composedResources:
        - virtual-machine

    - type: FromCompositeFieldPath
      description: Propagate namespace to VM metadata.namespace
      from: spec.namespace
      to: metadata.namespace
      composedResources:
        - virtual-machine

    # ── XR spec -> VM (resources) ──
    - type: FromCompositeFieldPath
      description: Propagate cpu to VM cpu cores
      from: spec.cpu
      to: spec.template.spec.domain.cpu.cores
      composedResources:
        - virtual-machine

    - type: FromCompositeFieldPath
      description: Propagate memory to VM memory requests
      from: spec.memory
      to: spec.template.spec.domain.resources.requests.memory
      composedResources:
        - virtual-machine


    # ── XR spec -> NAD (metadata) ──
    - type: FromCompositeFieldPath
      description: Propagate networkName to NAD metadata.name
      from: spec.networkName
      to: metadata.name
      composedResources:
        - network-attachment-definition

    # ── XR spec -> NAD (config) ──
    - type: CombineFromCompositeFieldPath
      description: Build NAD CNI config from XR network fields
      from:
        - spec.bridgeName
        - spec.subnet
        - spec.gateway
        - spec.gateway
      to: spec.config
      transform:
        type: string
        string:
          fmt: '{"cniVersion":"0.3.1","type":"bridge","bridge":"%s","ipam":{"type":"host-local","subnet":"%s","gateway":"%s","routes":[{"dst":"0.0.0.0/0","gw":"%s"}]}}'
      composedResources:
        - network-attachment-definition

    # ── NAD name -> VM network reference ──
    - type: FromComposedFieldPath
      description: Wire VM multus network to actual NAD name
      from: metadata.name
      fromComposedResources:
        - network-attachment-definition
      to: spec.template.spec.networks[0].multus.networkName
      toComposedResources:
        - virtual-machine

    # ── Composed status -> XR status ──
    - type: ToCompositeFieldPath
      description: Propagate NAD name to XR status
      from: metadata.name
      fromComposedResources:
        - network-attachment-definition
      to: status.nadName

    - type: ToCompositeFieldPath
      description: Propagate VM uid to XR status
      from: metadata.uid
      fromComposedResources:
        - virtual-machine
      to: status.vmUID

    - type: ToCompositeFieldPath
      description: Propagate VM conditions to XR status
      from: status.conditions
      fromComposedResources:
        - virtual-machine
      to: status.conditions

  pipeline:
    # Data disks: creates PVCs, patches VM disks/volumes dynamically
    - step: data-disk-reconciler
      functionRef:
        name: crossplane-function-data-disk-fn
    # IP inject: reads ExternalSecret secret, injects static IP into cloud-init
    - step: ip-inject
      functionRef:
        name: crossplane-function-ip-inject-fn
      policy:
        onMissingField: PASS
